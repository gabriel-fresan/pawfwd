[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawfwd"
version = "2.2.0"
description = "Encaminhamento de portas sobre um túnel WireGuard dedicado entre VPS e servidor doméstico."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/gabriel-fresan/pawfwd"
Issues = "https://github.com/gabriel-fresan/pawfwd/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pawfwd = "pawfwd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "I"]
